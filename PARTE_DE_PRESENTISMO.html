<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Parte informativo - Comisión 20</title>
<link rel="icon" id="ico">
<style>
:root{--bg:#0a1020;--s1:#111a2f;--s2:#18243f;--ln:#27385c;--tx:#e8eef9;--mu:#9bacc8;--au:#d9ac48;--ce:#6fb7e8;--rd:#f07178;--ok:#4cc790;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif;padding:0 clamp(12px,3vw,32px) 28px}
.cred{margin-inline:calc(-1 * clamp(12px,3vw,32px));padding:8px 12px;text-align:center;font-size:14px;color:var(--mu);background:var(--s1);border-bottom:1px solid var(--ln)}
.cred b{color:var(--au);font-weight:600}
.top,.grid{max-width:1180px;margin-inline:auto}
.top{display:flex;align-items:center;gap:18px;padding:20px 0;border-bottom:1px solid var(--au)}
.top img{width:84px;aspect-ratio:1;filter:drop-shadow(0 6px 16px #000b)}
h1{margin:0;font:600 clamp(24px,3.6vw,34px)/1.1 Georgia,"Times New Roman",serif}
.top p{margin:5px 0 0;color:var(--mu)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:20px;align-items:start}
.grid>aside{position:sticky;top:14px}
.card{background:var(--s1);border:1px solid var(--ln);border-radius:10px;padding:18px;margin-bottom:18px}
.card h2{margin:0 0 14px;font-size:16px;font-weight:600;color:var(--au)}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:12px}
.fld{display:grid;gap:4px;align-content:start}.fld.w{grid-column:1/-1}
label{display:grid;gap:5px;font-size:13px;color:var(--mu)}
input,select{width:100%;min-height:40px;background:var(--s2);color:var(--tx);border:1px solid var(--ln);border-radius:7px;padding:8px 10px;font:inherit}
input.man{border-color:var(--au)}
:focus-visible{outline:2px solid var(--ce);outline-offset:2px}
button{font:inherit;cursor:pointer;border-radius:7px;padding:10px 14px;border:1px solid var(--ln);background:var(--s2);color:var(--tx)}
button:hover{border-color:var(--ce)}
.pri{background:var(--au);border-color:var(--au);color:#171204;font-weight:600}
.pri:hover{background:#e8be5e;border-color:#e8be5e}
.link{background:none;border:0;padding:2px 0;color:var(--ce);font-size:13px;justify-self:start}
.nota,.vacio{color:var(--mu);font-size:13px;margin:8px 0 0}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px;min-height:28px}
.chips span{background:var(--s2);border:1px solid var(--ln);border-radius:999px;padding:2px 10px;font-size:13px;color:var(--mu)}
h3{margin:14px 0 6px;font-size:13px;color:var(--mu);font-weight:600}
ul{list-style:none;margin:0;padding:0}
li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--ln)}
li button{padding:4px 10px;font-size:13px;margin-left:6px}
pre{margin:0 0 14px;padding:14px;background:#0b1326;border:1px solid var(--ln);border-left:3px solid var(--au);border-radius:8px;font:13.5px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre-wrap;overflow-wrap:anywhere;max-height:calc(100vh - 210px);overflow:auto}
pre b{color:var(--au)}
.acts{display:flex;gap:10px;flex-wrap:wrap}.acts .pri{flex:1 1 160px}
#toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);opacity:0;background:var(--ok);color:#06210f;font-weight:600;padding:10px 18px;border-radius:8px;transition:.25s;pointer-events:none;z-index:9}
#toast.show{opacity:1;transform:translate(-50%,0)}#toast.err{background:var(--rd);color:#2a0709}
@media(max-width:900px){.grid{grid-template-columns:1fr}.grid>aside{position:static}pre{max-height:none}.top img{width:64px}}
@media(prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>

  art:  e => [e.det],
  aayrr: e => [e.det]
};
CUERPO.cm = e => [e.dx && `Dx: “${U(e.dx)}”`, e.motivo && `Motivo: ${e.motivo}`, e.cf && fh(e.cf, e.ch || '')];

const linea = (k, e, i) => {
  const s = SEC[k], id = `Cadete ${e.nom}, DNI ${dni(e.dni)}, ${s.c || 'Com'} ${COM}, ${s.h || 'Hab'} ${e.hab}`;
  if (k === 'comext') {
    const par = [e.par, e.sin && `Siniestro N° ${e.sin}`].filter(Boolean).join(', ');
    const tur = [e.turno && `el día ${dm(e.turno)}`, e.turnoH && (e.turno ? `a las ${e.turnoH} hs` : `${e.turnoH} hs`)].filter(Boolean).join(' ');
    return `${n2(i + 1)}- ${id}. Se dirige a ${e.lugar}${e.dir ? `, sito en ${e.dir}` : ''}. A fin de ${e.fin}` +
      `${par ? ` (${par})` : ''}${e.dx ? `, se encuentra bajo diagnóstico "${U(e.dx)}"` : ''}.` +
      `${tur ? ` Posee turno ${tur}${e.aut ? ` (${e.aut})` : ''}.` : e.aut ? ` ${e.aut}.` : ''}`;
  }
  return [`${n2(i + 1)}- ${id}`, ...(CUERPO[k] ? CUERPO[k](e) : [])].filter(Boolean).join('\n');
};

// Estado
let S = Object.fromEntries(Object.keys(SEC).map(k => [k, []]));
let M = {}; // contadores editados a mano
const KEY = 'parte-com20-v1';
const guardar = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (_) {} };
const cargar = () => {
  try { const d = JSON.parse(localStorage.getItem(KEY)); if (d) S = {...S, ...d}; } catch (_) {}
  S.gp.forEach(e => e.tg = e.tg || '13-20'); S.gi.forEach(e => e.tg = e.tg || '20-00');
};

// Contadores
const CNT = [['fe','Fuerza efectiva'],['pres','Presentes'],['aus','Ausentes'],['cm','Celulares masc.'],['cf','Celulares fem.'],['ca','Celulares aus.']];
const sexo = x => CAD.filter(c => c.s === x).length;
const ausSx = x => S.ausentes.filter(e => CAD[e.i] && CAD[e.i].s === x).length;
function auto() {
  const fe = M.fe ?? CAD.length, aus = S.ausentes.length;
  return {fe, pres: fe - aus, aus, cm: sexo('M') - ausSx('M'), cf: sexo('F') - ausSx('F'), ca: aus};
}
const val = k => M[k] ?? auto()[k];

// Texto final del parte (formato WhatsApp: *negrita*)
const tit = t => t.replace('-', 'HS A ') + 'HS';
const bloqueTurnos = k => {
  const s = SEC[k], gr = s.tur.map(t => [t, S[k].filter(e => e.tg === t)]).filter(g => g[1].length);
  if (!gr.length) return `*${s.t}:* (00)`;
  return gr.map(([t, a]) => `*${s.t} DE ${tit(t)}:* (${n2(a.length)})\n\n` + a.map((e, i) => linea(k, e, i)).join('\n\n')).join('\n\n');
};
const bloque = k => {
  if (SEC[k].tur) return bloqueTurnos(k);
  const s = SEC[k], it = S[k], c = k === 'ausentes' ? val('aus') : it.length, h = `*${s.t}:* (${n2(c)})`;
  return it.length ? h + (s.aire ? '\n\n' : '\n') + it.map((e, i) => linea(k, e, i)).join('\n\n') : h;
};
function texto() {
  const f = $('fecha').value;
  return [CAB.join('\n'), `*FECHA:* ${f ? dl(f) : ''}`,
    `*FUERZA EFECTIVA:* (${n2(val('fe'))})`, `*PRESENTES:* (${n2(val('pres'))})`,
    ...Object.keys(SEC).map(bloque),
    `*CELULARES MASCULINOS:* (${n2(val('cm'))})`, `*CELULARES FEMENINOS:* (${n2(val('cf'))})`,
    `*CELULARES AUSENTES:* (${n2(val('ca'))})`, 'ES TODO.'].join('\n\n');
}

// Pantalla
const vista = () => { $('out').innerHTML = esc(texto()).replace(/\*([^*\n]+)\*/g, '<b>*$1*</b>'); };
function contadores() {
  const a = auto();
  CNT.forEach(([k]) => { const el = $('c_' + k); el.classList.toggle('man', k in M); if (!(k in M)) el.value = a[k]; });
}
function lista() {
  const h = Object.keys(SEC).filter(k => S[k].length).map(k =>
    `<h3>${SEC[k].t} (${n2(S[k].length)})</h3><ul>` + S[k].map((e, j) =>
      `<li><span>${n2(j + 1)}- ${esc(e.nom)}${e.tg ? ` <small style="color:var(--mu)">(${e.tg.replace('-', ' a ')} hs)</small>` : ''}</span><span><button data-ed="${k}:${j}">Editar</button><button data-rm="${k}:${j}" aria-label="Quitar a ${esc(e.nom)}">Quitar</button></span></li>`
    ).join('') + '</ul>').join('');
  $('lista').innerHTML = h || '<p class="vacio">Todavía no hay novedades. Elegí un cadete y una sección para empezar.</p>';
}
function render() { lista(); contadores(); vista(); guardar(); }

const nomDef = () => { const c = CAD[$('cad').value]; return c ? `${c.a} ${(SEC[$('sec').value].full ? tc : prim)(c.n)}` : ''; };
function cadSel() {
  const c = CAD[$('cad').value];
  $('chips').innerHTML = c ? `<span>DNI ${dni(c.d)}</span><span>Hab ${c.h}</span><span>${c.s === 'M' ? 'Masculino' : 'Femenino'}</span>` : '';
  $('nom').value = nomDef(); $('nom').dataset.m = '';
}
function campos() {
  if (!$('nom').dataset.m) $('nom').value = nomDef();
  const s = SEC[$('sec').value], rq = s.req || [];
  $('campos').innerHTML = s.f.map(id => {
    const f = F[id], r = rq.includes(id), lab = f.l + (r ? '' : ' (opcional)');
    const op = id === 'tg' ? s.tur.map(t => [t, t.replace('-', ' a ') + ' hs']) : (f.o || []).map(o => [o, o]);
    const ctl = op.length
      ? `<select id="f_${id}">${op.map(([v, t]) => `<option value="${v}">${t}</option>`).join('')}</select>`
      : `<input id="f_${id}" type="${f.t || 'text'}" value="${f.v || ''}" placeholder="${f.ph || ''}"${f.list ? ` list="l_${id}"` : ''}${r ? ' required' : ''}>`;
    return `<div class="fld${f.w ? ' w' : ''}"><label>${lab}${ctl}</label>` +
      (f.list ? `<datalist id="l_${id}">${f.list.map(o => `<option value="${o}">`).join('')}</datalist>` : '') +
      (f.rsv ? '<button type="button" class="link" data-rsv>Usar «Diagnóstico reservado»</button>' : '') + '</div>';
  }).join('') || '<p class="vacio" style="grid-column:1/-1">Esta sección solo lleva los datos del cadete.</p>';
}

function agregar(ev) {
  ev.preventDefault();
  const i = +$('cad').value, k = $('sec').value, s = SEC[k], c = CAD[i], nom = $('nom').value.trim();
  const tg = s.tur ? $('f_tg').value : undefined;
  if (S[k].some(e => e.i === i && e.tg === tg)) return toast(`${nom} ya figura en ${s.t}${tg ? ` (${tg.replace('-', ' a ')} hs)` : ''}.`, 1);
  const e = {i, nom, dni: c.d, hab: c.h};
  s.f.forEach(id => e[id] = $('f_' + id).value.trim());
  S[k].push(e);
  if (s.tur) S[k].sort((a, b) => s.tur.indexOf(a.tg) - s.tur.indexOf(b.tg));
  $('cad').value = ''; cadSel(); campos(); if (tg) $('f_tg').value = tg; render();
  toast(`${nom} agregado a ${s.t}.`);
}
function editar(k, j) {
  const e = S[k].splice(j, 1)[0];
  $('sec').value = k; $('cad').value = e.i; cadSel(); campos();
  $('nom').value = e.nom; $('nom').dataset.m = '1';
  SEC[k].f.forEach(id => $('f_' + id).value = e[id] || '');
  render(); $('carga').scrollIntoView({behavior: 'smooth', block: 'center'});
  toast('Se quitó para editarlo. Corregí y volvé a agregarlo.');
}

async function copiar() {
  const t = texto();
  try { await navigator.clipboard.writeText(t); }
  catch (_) { const a = document.createElement('textarea'); a.value = t; document.body.append(a); a.select(); document.execCommand('copy'); a.remove(); }
  toast('Parte copiado. Ya podés pegarlo en WhatsApp.');
}
let tt;
function toast(m, err) {
  const t = $('toast'); t.textContent = m; t.className = 'show' + (err ? ' err' : '');
  clearTimeout(tt); tt = setTimeout(() => t.className = '', 2800);
}

// Eventos
$('carga').addEventListener('submit', agregar);
$('cad').addEventListener('change', cadSel);
$('sec').addEventListener('change', campos);
$('nom').addEventListener('input', () => { $('nom').dataset.m = '1'; });
$('fecha').addEventListener('input', vista);
$('auto').addEventListener('click', () => { M = {}; render(); });
$('copiar').addEventListener('click', copiar);
$('wa').addEventListener('click', () => window.open('https://wa.me/?text=' + encodeURIComponent(texto()), '_blank', 'noopener'));
$('nuevo').addEventListener('click', () => {
  if (!confirm('¿Empezar un parte nuevo? Se borran todas las novedades cargadas.')) return;
  Object.keys(S).forEach(k => S[k] = []); M = {}; render(); toast('Parte nuevo listo.');
});
$('cnt').addEventListener('input', e => {
  if (e.target.value === '') return;
  M[e.target.id.slice(2)] = +e.target.value; e.target.classList.add('man'); vista();
});
$('cnt').addEventListener('change', e => { if (e.target.value === '') delete M[e.target.id.slice(2)]; render(); });
document.addEventListener('click', ev => {
  const b = ev.target.closest('button'); if (!b) return;
  if (b.dataset.rsv !== undefined) $('f_dx').value = 'DIAGNÓSTICO RESERVADO';
  else if (b.dataset.rm) { const [k, j] = b.dataset.rm.split(':'); S[k].splice(+j, 1); render(); }
  else if (b.dataset.ed) { const [k, j] = b.dataset.ed.split(':'); editar(k, +j); }
});

// Inicio
$('cad').innerHTML = '<option value="">Elegí un cadete…</option>' + CAD.map((c, i) => `<option value="${i}">${c.a} ${c.n}</option>`).join('');
$('sec').innerHTML = Object.entries(SEC).map(([k, s]) => `<option value="${k}">${s.t}</option>`).join('');
$('cnt').innerHTML = CNT.map(([k, l]) => `<label>${l}<input id="c_${k}" type="number" min="0" inputmode="numeric"></label>`).join('');
const hoy = new Date();
$('fecha').value = `${hoy.getFullYear()}-${n2(hoy.getMonth() + 1)}-${n2(hoy.getDate())}`;
$('ico').href = $('esc').src;
cargar(); campos(); render();
</script>
</body>
</html>
